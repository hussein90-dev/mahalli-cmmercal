<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>محلي التجاري</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
small{color:#667085}h1{margin:4px 0 0;font-size:27px}.state{background:#eef2f7;border-radius:99px;padding:7px 10px;font-size:12px}
.intro,.panel,.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px}.intro{padding:17px;margin-bottom:16px}.intro h2{margin:0 0 5px;font-size:18px}.intro p{margin:0;color:#667085;font-size:13px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{min-height:122px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:30px;color:#172033;box-shadow:0 2px 9px #10182808}.card b{font-size:15px;text-align:center}
.panel{margin-top:16px;overflow:hidden}.head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e5e7eb}.head h2{flex:1;margin:0;font-size:18px}.close{width:38px;height:38px;border:0;border-radius:12px;background:#eef2f7;font-size:25px}.body{padding:16px}
button,input{font:inherit}button{cursor:pointer}.primary,.secondary{border:0;border-radius:12px;padding:11px 14px}.primary{background:#111827;color:#fff}.secondary{background:#eef2f7;color:#172033}
.form{display:grid;gap:10px}label{display:grid;gap:6px;font-size:13px}input{padding:12px;border:1px solid #e5e7eb;border-radius:12px}.list{display:grid;gap:8px;margin-top:14px}.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px}.item small{display:block;margin-top:4px}.empty{padding:18px;border:1px dashed #d0d5dd;border-radius:14px;text-align:center;color:#667085}
footer{display:flex;justify-content:space-between;color:#667085;font-size:12px;padding:16px 3px}.hidden{display:none!important}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
<header><div><small>نظام الإدارة المحلي</small><h1>محلي التجاري</h1></div><span class="state" id="state">محلي</span></header>
<section class="intro"><h2>المرحلة الأولى</h2><p>نسخة تجريبية ذاتية الاكتفاء: الواجهة + IndexedDB + النسخ الاحتياطي المحلي. ستضاف وظائف المحاسبة الكاملة فوق هذا الأساس.</p></section>
<section class="grid">
<button class="card" data-s="companies">🏢<b>الشركات والعملاء</b></button>
<button class="card" data-s="purchases">🛒<b>المشتريات</b></button>
<button class="card" data-s="suppliers">🏭<b>الموردون</b></button>
<button class="card" data-s="expenses">💸<b>المصروفات</b></button>
<button class="card" data-s="payments">💰<b>الدفعات</b></button>
<button class="card" data-s="reports">📊<b>التقارير</b></button>
<button class="card" data-s="search">🔍<b>البحث</b></button>
<button class="card" data-s="settings">⚙️<b>الإعدادات والنسخ الاحتياطي</b></button>
</section>
<section id="panel" class="panel hidden"><div class="head"><button class="close" id="close">×</button><h2 id="title"></h2></div><div class="body" id="body"></div></section>
<footer><span>البيانات محلية</span><span id="count">0 سجل</span></footer>
</main>
<script>
const DB="mahalli-commercial-db",STORE="records";let db;
const names={companies:"الشركات والعملاء",purchases:"المشتريات",suppliers:"الموردون",expenses:"المصروفات",payments:"الدفعات",reports:"التقارير",search:"البحث",settings:"الإعدادات والنسخ الاحتياطي"};
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function all(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function add(type,data={}){return new Promise((ok,no)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).add({type,createdAt:new Date().toISOString(),...data});r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function refresh(){document.getElementById("count").textContent=(await all()).length+" سجل"}
async function render(type){let b=document.getElementById("body");let rows=(await all()).filter(x=>x.type===type).reverse();b.querySelector(".list").innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x.name||"سجل تجريبي")}</b><small>${new Date(x.createdAt).toLocaleString("ar-IQ")}</small></div>`).join(""):'<div class="empty">لا توجد سجلات بعد.</div>'}
function section(type){let b=document.getElementById("body");document.getElementById("title").textContent=names[type];
if(type==="settings"){b.innerHTML=`<div class="form"><label>اسم المؤسسة<input id="biz" placeholder="محلي التجاري"></label><div><button class="primary" id="save">حفظ</button> <button class="secondary" id="backup">إنشاء نسخة</button></div><label>استعادة نسخة<input id="restore" type="file" accept=".json"></label></div>`;biz.value=localStorage.biz||"محلي التجاري";save.onclick=()=>{localStorage.biz=biz.value.trim()||"محلي التجاري";alert("تم الحفظ")};backup.onclick=backupData;restore.onchange=restoreData;return}
if(type==="search"){b.innerHTML=`<div class="form"><label>بحث<input id="q" placeholder="اسم أو رقم أو نص"></label><div class="list" id="results"><div class="empty">اكتب كلمة للبحث.</div></div></div>`;q.oninput=search;return}
b.innerHTML=`<p style="color:#667085;line-height:1.7">تم تجهيز الهيكل لهذا القسم. الوظائف المحاسبية الكاملة ستضاف في المرحلة التالية.</p><button class="primary" id="demo">إضافة سجل تجريبي</button><div class="list"></div>`;
demo.onclick=async()=>{await add(type,{name:"سجل تجريبي"});await render(type);refresh()};render(type)}
async function search(){let q=this.value.trim().toLowerCase(),box=results;if(!q){box.innerHTML='<div class="empty">اكتب كلمة للبحث.</div>';return}let rows=(await all()).filter(x=>JSON.stringify(x).toLowerCase().includes(q));box.innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x.name||x.type)}</b><small>${esc(x.type)}</small></div>`).join(""):'<div class="empty">لم يتم العثور على نتائج.</div>'}
async function backupData(){let data={format:"mahalli-commercial-backup",version:1,createdAt:new Date().toISOString(),settings:{biz:localStorage.biz||"محلي التجاري"},records:await all()};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="mahalli-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
async function restoreData(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=="mahalli-commercial-backup")throw 0;if(!confirm("استعادة النسخة ستستبدل البيانات الحالية. متابعة؟"))return;let s=db.transaction(STORE,"readwrite").objectStore(STORE);await new Promise((ok,no)=>{let r=s.clear();r.onsuccess=ok;r.onerror=no});for(let r of x.records){let c={...r};delete c.id;await add(c.type,c)}if(x.settings?.biz)localStorage.biz=x.settings.biz;await refresh();alert("تمت الاستعادة")}catch{alert("ملف غير صالح")}e.target.value=""}
document.querySelectorAll(".card").forEach(x=>x.onclick=()=>{panel.classList.remove("hidden");section(x.dataset.s)});close.onclick=()=>panel.classList.add("hidden");
(async()=>{db=await openDB();refresh()})();
</script>
</body>
</html>
